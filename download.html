<html>
<head>
    <title>Download Sample</title>
</head>
<body>
    <p>ボタンをクリックすると、70%の確率で「サンプル.aspx」、30%の確率で「サンプル.csv」のいずれかがランダムにダウンロードされます。</p>
    <button id="btn_download" type="button">ダウンロード</button>

    <script>
        document.getElementById('btn_download').addEventListener('click', function () {
            var useAspx = Math.random() < 0.7;
            var fileName = useAspx ? 'サンプル.aspx' : 'サンプル.csv';
            var link = document.createElement('a');
            link.href = encodeURIComponent(fileName);
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
